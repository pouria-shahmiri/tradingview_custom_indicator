<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Advanced TradingView Chart with Order Block Detector</title>

    <!-- Fix for iOS Safari zooming bug -->
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- TradingView Charting Library -->
    <script
      type="text/javascript"
      src="https://charting-library.tradingview-widget.com/charting_library/charting_library.standalone.js"
    ></script>

    <!-- UDF Datafeed -->
    <script
      type="text/javascript"
      src="https://charting-library.tradingview-widget.com/datafeeds/udf/dist/bundle.js"
    ></script>

    <!-- Main Script -->
    <script type="text/javascript" src="script.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
        background-color: #131722;
        overflow: hidden;
      }

      #tv_chart_container {
        width: 100vw;
        height: 100vh;
      }

      .info-banner {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 12px 24px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        z-index: 1000;
        font-size: 14px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 10px;
        animation: slideDown 0.5s ease-out;
      }

      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateX(-50%) translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
      }

      .info-banner .indicator-badge {
        background: rgba(255, 255, 255, 0.2);
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 600;
      }

      .hide-banner {
        animation: slideUp 0.3s ease-out forwards;
      }

      @keyframes slideUp {
        to {
          opacity: 0;
          transform: translateX(-50%) translateY(-20px);
        }
      }
    </style>
  </head>

  <body>
    <div id="tv_chart_container"></div>

    <div id="infoBanner" class="info-banner">
      <span class="indicator-badge">OB Detector Active</span>
      <span>Advanced TradingView Chart with Order Block Detector Indicator</span>
    </div>

    <script>
      // Hide banner after 5 seconds
      setTimeout(() => {
        const banner = document.getElementById("infoBanner");
        if (banner) {
          banner.classList.add("hide-banner");
          setTimeout(() => {
            banner.style.display = "none";
          }, 300);
        }
      }, 5000);
    </script>
  </body>
</html>
